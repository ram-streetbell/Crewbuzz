name: Build and Release CrewBuzz

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign release APK
        run: |
          set -e
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/crewbuzz-release.jks"
          ALIGNED="app/build/outputs/apk/release/crewbuzz-aligned.apk"
          SIGNED="app/build/outputs/apk/release/CrewBuzz.apk"

          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "crewbuzz-test-key" -keypass "crewbuzz-test-key" -alias crewbuzz -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CrewBuzz, OU=CrewBuzz, O=CrewBuzz, L=Chennai, ST=Tamil Nadu, C=IN"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK_UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias crewbuzz --ks-pass pass:crewbuzz-test-key --key-pass pass:crewbuzz-test-key --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          ls -lh "$SIGNED"
          echo "APK_PATH=$SIGNED" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CrewBuzz v${{ github.run_number }}
          generate_release_notes: true
          files: ${{ env.APK_PATH }}